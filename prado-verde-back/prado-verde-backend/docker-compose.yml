version: '3.8'

services:
  # Servicio de PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: prado-verde-db
    environment:
      POSTGRES_USER: ${DB_USER:-usuario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clave}
      POSTGRES_DB: ${DB_NAME:-prado_verde}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prado_verde_bd.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-usuario}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prado-verde-network

  # Servicio del Backend
  backend:
    build: .
    container_name: prado-verde-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      DATABASE_URL: postgres://${DB_USER:-usuario}:${DB_PASSWORD:-clave}@postgres:5432/${DB_NAME:-prado_verde}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-cambia_este_valor_por_uno_aleatorio_y_largo}
      OTP_EXP_MINUTES: ${OTP_EXP_MINUTES:-5}
      # Proveedores de mensajería
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      # Twilio (SMS y WhatsApp)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      # SendGrid (Email)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@pradoverde.com}
      # SMTP (Email alternativo)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Meta WhatsApp API
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prado-verde-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  prado-verde-network:
    driver: bridge
