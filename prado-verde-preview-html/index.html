<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />

<style>

  .gap-1{gap:4px;} .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;}

  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);}

  .card-lg{background:#fff;border:1px solid var(--border);border-radius:24px;padding:20px;}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px;font-size:14px;font-weight:600;width:100%;}
  .btn-dark{background:var(--forest);color:#fff;}
  .btn-leaf{background:var(--leaf);color:#fff;border-radius:14px;padding:0 12px;height:38px;}
  .btn-text{color:var(--leaf);font-size:13px;font-weight:500;}

<div id="root"></div>

<script>
/* ---------------------------------------------------------------
   PRADO VERDE · Gestión Integral del Riesgo de Desastres
   2 torres · 18 pisos · 6 aptos por piso · 216 unidades
   Versión JS puro (sin frameworks externos) para previsualización
--------------------------------------------------------------- */

const TORRES = [1, 2];
const PISOS = Array.from({ length: 18 }, (_, i) => i + 1);
const APTOS_POR_PISO = ["01", "02", "03", "04", "05", "06"];

function aptoId(torre, piso, apto) { return `T${torre}-${String(piso).padStart(2, "0")}${apto}`; }

// Numeración real de apartamentos
// Torre 1: Piso 1 = 107-112, Piso 2 = 207-212, etc.
// Torre 2: Piso 1 = 13-18, Piso 2 = 23-28, etc.
function getAptNumero(torre, piso, aptoIndex) {
  // aptoIndex es 0-5 (convertir desde "01"-"06")
  const idx = typeof aptoIndex === 'string' ? parseInt(aptoIndex, 10) - 1 : aptoIndex;
  if (torre === 1) {
    return String((piso * 100) + 7 + idx);
  } else {
    return String((piso * 10) + 3 + idx);
  }
}

function seedApartments() {
  const out = {};
  TORRES.forEach((torre) => {
    PISOS.forEach((piso) => {
      APTOS_POR_PISO.forEach((apto) => {
        const id = aptoId(torre, piso, apto);
        out[id] = {
          id, torre, piso, numero: getAptNumero(torre, piso, apto),
          telefonoPrincipal: "",
          whatsapp: "",
          email: "",
          residentes: [],
          mascotas: [],
          caracterizacion: { adultosMayores: false, ninos: false, movilidadReducida: false, dificultadNeurologica: false, otras: "" },
          alarmaPrioridad: false,
          notaAdmin: "",
        };
      });
    });
  });
  return out;
}

function genOtp() { return String(Math.floor(100000 + Math.random() * 900000)); }
function maskPhone(phone) { if (!phone || phone.length < 4) return "••••••"; return "••• ••• " + phone.slice(-4); }
function maskEmail(email) {
  if (!email || !email.includes("@")) return "•••@•••";
  const [local, domain] = email.split("@");
  const masked = local.length > 2 ? local[0] + "•••" + local.slice(-1) : "•••";
  return masked + "@" + domain;
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ---------------------------- Almacenamiento persistente ---------------------------- */

// Guardar en localStorage como cache/fallback
async function loadApartmentsLocal() {
  try {
    const res = await window.storage.get("pv2:apartments", true);
    if (res && res.value) return JSON.parse(res.value);
  } catch (e) {}
  return seedApartments();
}
async function saveApartmentsLocal(data) { 
  try { await window.storage.set("pv2:apartments", JSON.stringify(data), true); } catch (e) { console.error(e); } 
}

// Cargar apartamentos: intenta del backend, fallback a localStorage
async function loadApartments() {
  const localData = await loadApartmentsLocal();
  return localData;
}

// Cargar datos de un apartamento específico desde el backend
async function loadApartmentFromBackend(identificador) {
  const token = S.adminToken || S.residentToken;
  if (!token) return null;
  
  try {
    const res = await fetch(`${API_BASE_URL}/apartments/${identificador}`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    if (!res.ok) return null;
    
    const data = await res.json();
    if (!data.ok) return null;
    
    // Convertir formato backend a formato frontend
    const apt = data.apartamento;
    return {
      id: apt.identificador,
      identificador: apt.identificador,
      telefonoPrincipal: apt.telefono_principal || "",
      whatsapp: apt.whatsapp || "",
      email: apt.email || "",
      residentes: (data.residentes || []).map(r => ({
        nombre: r.nombre,
        documento: r.documento,
        principal: r.es_principal
      })),
      mascotas: (data.mascotas || []).map(m => ({
        nombre: m.nombre,
        tipo: m.tipo.charAt(0).toUpperCase() + m.tipo.slice(1),
        cantidad: m.cantidad || 1
      })),
      caracterizacion: data.caracterizacion ? {
        adultosMayores: data.caracterizacion.personas_mayores,
        ninos: data.caracterizacion.ninos,
        movilidadReducida: data.caracterizacion.movilidad_reducida,
        dificultadNeurologica: data.caracterizacion.dificultad_neurologica,
        otras: ""
      } : { adultosMayores: false, ninos: false, movilidadReducida: false, dificultadNeurologica: false, otras: "" },
      alarmaPrioridad: data.caracterizacion?.prioridad_evacuacion || false,
      notaAdmin: "",
    };
  } catch (err) {
    console.error("Error cargando apartamento del backend:", err);
    return null;
  }
}

// Guardar apartamento en backend Y en localStorage
async function saveApartmentToBackend(aptData) {
  const token = S.adminToken || S.residentToken;
  if (!token) {
    console.warn("No hay token para guardar en backend");
    return { ok: false, error: "No hay sesión activa. Inicia sesión de nuevo." };
  }
  
  console.log("🔄 Guardando en backend:", aptData.id, "con token:", token.substring(0, 20) + "...");
  
  try {
    // 1. Actualizar datos de contacto
    console.log("📞 Actualizando contacto...");
    const contactRes = await fetch(`${API_BASE_URL}/apartments/${aptData.id}`, {
      method: "PUT",
      headers: { 
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        telefono_principal: aptData.telefonoPrincipal || null,
        whatsapp: aptData.whatsapp || null,
        email: aptData.email || null
      }),
    });
    
    if (!contactRes.ok) {
      const err = await contactRes.json();
      console.error("❌ Error actualizando contacto:", err);
      return { ok: false, error: err.error || "Error actualizando contacto" };
    }
    console.log("✅ Contacto actualizado");
    
    // 2. Limpiar residentes existentes y agregar nuevos
    console.log("👥 Limpiando residentes existentes...");
    await fetch(`${API_BASE_URL}/apartments/${aptData.id}/residentes/clear`, {
      method: "DELETE",
      headers: { "Authorization": `Bearer ${token}` }
    });
    
    console.log("👥 Agregando", aptData.residentes.length, "residentes...");
    for (const residente of aptData.residentes) {
      const resRes = await fetch(`${API_BASE_URL}/apartments/${aptData.id}/residentes`, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          nombre: residente.nombre,
          documento: residente.documento,
          es_principal: residente.principal || false
        }),
      });
      if (!resRes.ok) {
        console.error("❌ Error guardando residente:", await resRes.text());
      }
    }
    
    // 3. Limpiar mascotas existentes y agregar nuevas
    console.log("🐾 Limpiando mascotas existentes...");
    await fetch(`${API_BASE_URL}/apartments/${aptData.id}/mascotas/clear`, {
      method: "DELETE",
      headers: { "Authorization": `Bearer ${token}` }
    });
    
    console.log("🐾 Agregando", aptData.mascotas.length, "mascotas...");
    for (const mascota of aptData.mascotas) {
      const mascRes = await fetch(`${API_BASE_URL}/apartments/${aptData.id}/mascotas`, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          nombre: mascota.nombre,
          tipo: mascota.tipo.toLowerCase(),
          cantidad: mascota.cantidad || 1
        }),
      });
      if (!mascRes.ok) {
        console.error("❌ Error guardando mascota:", await mascRes.text());
      }
    }
    
    // 4. Guardar caracterización
    console.log("📋 Guardando caracterización...");
    const c = aptData.caracterizacion;
    await fetch(`${API_BASE_URL}/apartments/${aptData.id}/caracterizacion`, {
      method: "PUT",
      headers: { 
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        personas_mayores: c.adultosMayores || false,
        ninos: c.ninos || false,
        movilidad_reducida: c.movilidadReducida || false,
        dificultad_neurologica: c.dificultadNeurologica || false,
        prioridad_evacuacion: aptData.alarmaPrioridad || false
      }),
    });
    
    console.log("✅ Datos guardados en backend:", aptData.id);
    return { ok: true };
  } catch (err) {
    console.error("❌ Error guardando en backend:", err);
    return { ok: false, error: err.message };
  }
}

async function saveApartments(data) { 
  // Siempre guardar en localStorage como cache
  await saveApartmentsLocal(data);
}

async function loadBrigada() {
  try { const res = await window.storage.get("pv2:brigada", true); if (res && res.value) return JSON.parse(res.value); } catch (e) {}
  return [];
}
async function saveBrigada(list) { try { await window.storage.set("pv2:brigada", JSON.stringify(list), true); } catch (e) {} }
async function loadSimulacros() {
  try { const res = await window.storage.get("pv2:simulacros", true); if (res && res.value) return JSON.parse(res.value); } catch (e) {}
  return [];
}
async function saveSimulacros(list) { try { await window.storage.set("pv2:simulacros", JSON.stringify(list), true); } catch (e) {} }

function icon(name, size, cls) {
  size = size || 18; cls = cls || "";
  return `<svg class="icon ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || '<circle cx="12" cy="12" r="9"/>'}</svg>`;
}

function badge(tone, text, iconName) {
  return `<span class="badge badge-${tone}">${iconName ? icon(iconName, 11) : ""}${esc(text)}</span>`;
}
function iconTile(name, tone) { return `<div class="icon-tile ${tone}">${icon(name, 19)}</div>`; }

const API_BASE_URL = "https://pruebapradoverde-back.onrender.com/api";

async function apiPost(path, body) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  return { status: res.status, ok: res.ok, data };
}

function setDeep(obj, path, value) {
  const parts = path.split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = value;
}
function getDeep(obj, path) {
  return path.split(".").reduce((c, k) => (c == null ? c : c[k]), obj);
}

function statusColor(apt) {

  const c = apt.caracterizacion;

}

        <div class="flex items-center justify-between" style="margin-bottom:12px;">
          <p style="font-size:14px;font-weight:700;color:var(--forest);margin:0;">${icon("home", 16)} Apartamentos - Piso ${S.selectorPiso}</p>
          <button data-action="clear-piso" class="btn-text" style="font-size:12px;">Cambiar piso</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">`;
    
    APTOS_POR_PISO.forEach((apto) => {
      const id = aptoId(S.selectorTorre, S.selectorPiso, apto);
      const apt = S.apartments[id];
      const hasData = apt.residentes.length > 0;
      const isVulnerable = apt.caracterizacion.adultosMayores || apt.caracterizacion.ninos || apt.caracterizacion.movilidadReducida || apt.caracterizacion.dificultadNeurologica;
      const totalMascotas = apt.mascotas.reduce((sum, m) => sum + (m.cantidad || 1), 0);
      
      let statusBg = '#fff';
      let statusBorder = 'var(--border3)';
      let statusIcon = 'home';
      if (apt.alarmaPrioridad) { statusBg = 'var(--coral-bg)'; statusBorder = 'var(--coral)'; statusIcon = 'siren'; }
      else if (isVulnerable) { statusBg = 'var(--amber-bg)'; statusBorder = 'var(--amber)'; statusIcon = 'heartpulse'; }
      else if (hasData) { statusBg = 'var(--leaf-bg)'; statusBorder = 'var(--leaf-bd)'; statusIcon = 'check'; }
      
      html += `
        <button data-action="open-apt" data-id="${id}" data-isadmin="1" class="card" style="padding:12px;cursor:pointer;border:1.5px solid ${statusBorder};background:${statusBg};text-align:left;">
          <div class="flex items-center gap-2" style="margin-bottom:6px;">
            <div style="width:32px;height:32px;border-radius:10px;background:${statusColor(apt)};display:flex;align-items:center;justify-content:center;">
              ${icon(statusIcon, 16, "")}
            </div>
            <div>
              <p style="font-size:15px;font-weight:700;color:var(--forest);margin:0;">Apto ${apt.numero}</p>
              <p style="font-size:10px;color:var(--muted);margin:0;">${id}</p>
            </div>
          </div>
          <div style="font-size:11px;color:var(--muted);">
            ${hasData ? `<span style="color:var(--leaf);">${icon("users", 11)} ${apt.residentes.length}</span>` : '<span>Sin datos</span>'}
            ${totalMascotas > 0 ? ` · ${icon("pawprint", 11)} ${totalMascotas}` : ''}
          </div>
        </button>`;
    });
    html += `</div></div>`;
  }
  
  html += `</div>`;
  return html;
}

function adminStats() {
  const list = Object.values(S.apartments);
  return {
    total: list.length,
    registrados: list.filter((a) => a.residentes.length > 0).length,
    prioridad: list.filter((a) => a.alarmaPrioridad).length,
    mascotas: list.reduce((n, a) => n + a.mascotas.reduce((sum, m) => sum + (m.cantidad || 1), 0), 0),
  };
}

function aptSearchResultsHTML() {
  const q = S.adminQuery.trim().toLowerCase();
  if (!q) return `<p style="font-size:14px;color:var(--muted2);text-align:center;padding:24px 0;">Escribe para buscar un apartamento, o usa el mapa de torres en Resumen.</p>`;
  const list = Object.values(S.apartments).filter((a) =>
    a.id.toLowerCase().includes(q) || a.numero.includes(q) ||
    a.residentes.some((r) => r.nombre.toLowerCase().includes(q) || r.documento.includes(q))
  ).slice(0, 20);
  if (list.length === 0) return `<p style="font-size:14px;color:var(--muted2);text-align:center;padding:24px 0;">Sin resultados.</p>`;
  return list.map((a) => `
    <button class="row-item" data-action="open-apt" data-id="${a.id}" data-isadmin="1" style="width:100%;text-align:left;">
      <div style="width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:${statusColor(a)};">${a.numero}</div>
      <div class="flex-1">
        <p style="font-size:14px;font-weight:600;color:var(--forest);margin:0;">Torre ${a.torre} · Apto ${a.numero}</p>
        <p style="font-size:12px;color:var(--muted2);margin:1px 0 0;">${a.residentes.length} residentes · ${a.mascotas.reduce((sum, m) => sum + (m.cantidad || 1), 0)} mascotas</p>
      </div>
      ${a.alarmaPrioridad ? badge("coral", "Prioridad", "siren") : ""}
    </button>`).join("");
}

            <input class="input" style="flex:1;" data-bind="newRes.nombre" value="${esc(S.newRes.nombre)}" placeholder="Nombre completo" />
            <input class="input" style="width:110px;" data-bind="newRes.documento" value="${esc(S.newRes.documento)}" placeholder="N.° documento" />
            <button data-action="add-resident" class="btn-leaf">${icon("userplus", 16)}</button>
          </div>
        </section>

        <section>
          <h3 class="section-title">${icon("pawprint", 13)} Mascotas (${d.mascotas.reduce((sum, m) => sum + (m.cantidad || 1), 0)} total)</h3>
          ${d.mascotas.map((m, i) => `
            <div class="row-item">
              ${icon("pawprint", 16)}
              <p class="flex-1" style="font-size:14px;font-weight:500;color:var(--forest);margin:0;">${esc(m.nombre)}</p>
              <div class="flex items-center gap-1" style="background:var(--pale);border-radius:8px;padding:2px 4px;">
                <button data-action="pet-qty-dec" data-idx="${i}" style="width:24px;height:24px;border-radius:6px;background:var(--border3);color:var(--forest);font-weight:700;font-size:14px;">−</button>
                <span style="min-width:24px;text-align:center;font-size:13px;font-weight:600;color:var(--forest);">${m.cantidad || 1}</span>
                <button data-action="pet-qty-inc" data-idx="${i}" style="width:24px;height:24px;border-radius:6px;background:var(--leaf);color:#fff;font-weight:700;font-size:14px;">+</button>
              </div>
              ${badge("ink", m.tipo)}
              <button data-action="remove-pet" data-idx="${i}" style="color:#C0392B;padding:4px;">${icon("trash", 14)}</button>
            </div>`).join("")}
          <div style="margin-top:8px;padding:12px;background:var(--pale);border-radius:14px;">
            <p style="font-size:11px;font-weight:700;color:var(--muted);margin:0 0 8px;">Agregar mascota</p>
            <div class="flex gap-2 items-center flex-wrap">
              <div style="flex:2;min-width:120px;">
                <label class="label">Nombre</label>
                <input class="input" data-bind="newPet.nombre" value="${esc(S.newPet.nombre)}" placeholder="Ej: Luna, Max..." />
              </div>
              <div style="flex:1;min-width:90px;">
                <label class="label">Tipo</label>
                <select class="select" data-bind="newPet.tipo" style="width:100%;">
                  <option value="Canino" ${S.newPet.tipo === "Canino" ? "selected" : ""}>Canino</option>
                  <option value="Felino" ${S.newPet.tipo === "Felino" ? "selected" : ""}>Felino</option>
                  <option value="Ave" ${S.newPet.tipo === "Ave" ? "selected" : ""}>Ave</option>
                  <option value="Otro" ${S.newPet.tipo === "Otro" ? "selected" : ""}>Otro</option>
                </select>
              </div>
              <div style="min-width:80px;">
                <label class="label">Cantidad</label>
                <div class="flex items-center gap-1">
                  <button data-action="new-pet-qty-dec" style="width:32px;height:38px;border-radius:8px;background:var(--border3);color:var(--forest);font-weight:700;font-size:16px;">−</button>
                  <input class="input" type="number" min="1" max="99" data-bind="newPet.cantidad" value="${S.newPet.cantidad}" style="width:50px;text-align:center;padding:10px 4px;" />
                  <button data-action="new-pet-qty-inc" style="width:32px;height:38px;border-radius:8px;background:var(--leaf);color:#fff;font-weight:700;font-size:16px;">+</button>
                </div>
              </div>
              <div style="padding-top:18px;">
                <button data-action="add-pet" class="btn-leaf" style="height:42px;width:42px;padding:0;">${icon("plus", 18)}</button>
              </div>
            </div>
          </div>
        </section>

        <section>
          <h3 class="section-title">${icon("heartpulse", 13)} Caracterización de habitantes</h3>
          <div class="g2">
            ${carItems.map(([key, label, ic]) => `<button data-action="toggle-car" data-key="${key}" class="toggle-btn ${c[key] ? "active" : ""}">${icon(ic, 15)} ${label}</button>`).join("")}
          </div>
          <input class="input" style="margin-top:8px;" data-bind="modalData.caracterizacion.otras" value="${esc(c.otras)}" placeholder="Otras condiciones relevantes (opcional)" />
        </section>

        ${S.modalIsAdmin ? `
        <section>
          <h3 class="section-title">${icon("siren", 13)} Alarma de prioridad (administración)</h3>
          <button data-action="toggle-alarm" class="btn ${d.alarmaPrioridad ? "" : "btn-dark"}" style="${d.alarmaPrioridad ? "background:var(--coral);color:#fff;" : "background:#fff;color:var(--ink);border:1px solid var(--border3);"} justify-content:flex-start;">
            ${icon("bell", 16)} ${d.alarmaPrioridad ? "Prioridad activada — evacuación asistida" : "Activar prioridad de evacuación asistida"}
          </button>
          <textarea class="input" rows="2" style="margin-top:8px;" data-bind="modalData.notaAdmin" placeholder="Nota interna para brigada (ej: silla de ruedas, oxígeno, piso alto sin ascensor...)">${esc(d.notaAdmin)}</textarea>
        </section>` : ""}

        <button data-action="save-apt" class="btn btn-dark">${icon("save", 16)} Guardar información</button>
      </div>
    </div>
  </div>`;
}

/* ---------------------------- Render principal ---------------------------- */

function render() {
  const root = document.getElementById("root");
  if (S.loading || !S.apartments) {
    root.innerHTML = `<div class="screen flex items-center justify-center" style="min-height:100vh;"><div class="flex flex-col items-center gap-3">${icon("pawprint", 28)}<p style="font-size:14px;color:var(--muted);">Cargando Prado Verde…</p></div></div>`;
    return;
  }
  let html = "";
  if (S.view === "landing") html = viewLanding();
  else if (S.view === "admin-login") html = viewAdminLogin();
  else if (S.view === "admin") html = viewAdminDashboard();
  else if (S.view === "resident-login") html = viewResidentLogin();
  else if (S.view === "resident") html = viewResidentDashboard();
  root.innerHTML = html;
}

/* ---------------------------- Manejo de eventos ---------------------------- */

const root = document.getElementById("root");

root.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.bind) {
    setDeep(S, el.dataset.bind, el.value);
    if (el.dataset.live === "apt-search-results") {
      document.getElementById("apt-search-results").innerHTML = aptSearchResultsHTML();
    }
  }
});

root.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.bind) {
    let val = el.value;
    if (el.tagName === "SELECT" && !isNaN(Number(val)) && ["residentTorre", "residentPiso"].includes(el.dataset.bind)) val = Number(val);
    setDeep(S, el.dataset.bind, val);
    render();
  }
});

root.addEventListener("submit", async (e) => {
  e.preventDefault();
  const action = e.target.dataset.action;

  if (action === "admin-login-submit") {
    try {
      const { ok, data } = await apiPost("/auth/admin/login", { usuario: S.formAdmin.user, password: S.formAdmin.pass });
      S.backendModo = true;
      if (ok) {
        S.adminToken = data.token; S.adminErr = ""; S.view = "admin";
        saveSession();
      } else {
        S.adminErr = data.error || "Usuario o contraseña incorrectos.";
      }
    } catch (netErr) {
      // Backend no disponible: modo demo local
      S.backendModo = false;
      if (S.formAdmin.user.trim().toLowerCase() === "admin" && S.formAdmin.pass === "Login exito2026") {
        S.adminErr = ""; S.view = "admin";
        saveSession();
      } else { S.adminErr = "Usuario o contraseña incorrectos."; }
    }
    render();
  }

  else if (action === "resident-verify") {
    const [torre, piso, apto] = [S.residentTorre, S.residentPiso, S.residentApto];
    if (S.backendModo === true) {
      try {
        const { ok, data } = await apiPost("/auth/resident/verify-code", { torre, piso, apto, codigo: S.residentOtpInput.trim() });
        if (ok) {
          S.residentToken = data.token;
          S.residentAptId = aptoId(torre, piso, apto);
          S.view = "resident"; S.residentErr = "";
          saveSession();
        } else { S.residentErr = data.error || "Código incorrecto."; }
      } catch (netErr) {
        S.residentErr = "No se pudo contactar al backend para verificar el código.";
      }
    } else {
      // Modo demo local (backend no disponible)
      if (S.residentOtpInput.trim() === S.residentOtp) {
        S.residentAptId = aptoId(torre, piso, apto);
        S.view = "resident"; S.residentErr = "";
        saveSession();
      } else { S.residentErr = "Código incorrecto. Verifica el mensaje de texto recibido."; }
    }
    render();
  }
});

root.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === "goto") { S.view = btn.dataset.view; S.adminErr = ""; S.residentErr = ""; render(); }

  else if (action === "logout") {
    S.view = "landing"; S.residentAptId = null; S.modalAptId = null; S.adminToken = null; S.residentToken = null;
    S.formAdmin = { user: "", pass: "" }; S.residentStep = 1; S.residentOtp = null; S.residentOtpInput = "";
    localStorage.removeItem('pv2:session');
    render();
  }

  else if (action === "toggle-pass") {
    S.showPass = !S.showPass;
    render();
  }

  else if (action === "resident-request-code") {
    const torre = S.residentTorre, piso = S.residentPiso, apto = S.residentApto;
    const method = btn.dataset.method || "sms"; // sms, whatsapp, email
    const methodLabels = { sms: "SMS", whatsapp: "WhatsApp", email: "correo electrónico" };
    try {
      const { ok, data } = await apiPost("/auth/resident/request-code", { torre, piso, apto, method });
      S.backendModo = true;
      if (ok) {
        S.residentDemoBanner = data.codigoDemo
          ? `Código enviado por ${methodLabels[method]} a ${data.contactoEnmascarado || data.telefonoEnmascarado}. (Backend en modo desarrollo — código: ${data.codigoDemo})`
          : `Código enviado por ${methodLabels[method]} a ${data.contactoEnmascarado || data.telefonoEnmascarado}.`;
        S.residentStep = 2; S.residentErr = "";
      } else {
        S.residentErr = data.error || "No se pudo enviar el código.";
      }
    } catch (netErr) {
      // Backend no disponible: modo demo local usando los datos guardados en este navegador
      S.backendModo = false;
      const id = aptoId(torre, piso, apto);
      const record = S.apartments[id];
      let contactValue = "";
      let maskedContact = "";
      if (method === "sms") {
        contactValue = record.telefonoPrincipal;
        maskedContact = maskPhone(contactValue);
      } else if (method === "whatsapp") {
        contactValue = record.whatsapp;
        maskedContact = maskPhone(contactValue);
      } else if (method === "email") {
        contactValue = record.email;
        maskedContact = maskEmail(contactValue);
      }
      
      if (!contactValue) {
        S.residentErr = `Este apartamento no tiene ${methodLabels[method]} registrado. Contacte a la administración.`;
      } else {
        const code = genOtp();
        S.residentOtp = code;
        S.residentDemoBanner = `Código enviado por ${methodLabels[method]} a ${maskedContact}. (Demo local — backend no disponible: ${code})`;
        S.residentStep = 2; S.residentErr = "";
      }
    }
    render();
  }
  else if (action === "resident-change-apt") { S.residentStep = 1; S.residentErr = ""; S.residentOtpInput = ""; render(); }

  else if (action === "set-tab") { S.adminTab = btn.dataset.tab; S.selectorTorre = null; S.selectorPiso = null; render(); }

  else if (action === "select-torre") {
    S.selectorTorre = Number(btn.dataset.torre);
    S.selectorPiso = null;
    render();
  }
  else if (action === "select-piso") {
    S.selectorPiso = Number(btn.dataset.piso);
    render();
  }
  else if (action === "clear-torre") {
    S.selectorTorre = null;
    S.selectorPiso = null;
    render();
  }
  else if (action === "clear-piso") {
    S.selectorPiso = null;
    render();
  }

  else if (action === "open-apt") {
    const aptId = btn.dataset.id;
    S.modalAptId = aptId;
    S.modalIsAdmin = btn.dataset.isadmin === "1";
    S.newRes = { nombre: "", documento: "" };
    S.newPet = { nombre: "", tipo: "Canino", cantidad: 1 };
    
    // Intentar cargar datos del backend primero
    const backendData = await loadApartmentFromBackend(aptId);
    if (backendData) {
      // Merge con datos locales (mantener torre, piso, numero)
      const localApt = S.apartments[aptId];
      S.modalData = {
        ...localApt,
        telefonoPrincipal: backendData.telefonoPrincipal || localApt.telefonoPrincipal,
        whatsapp: backendData.whatsapp || localApt.whatsapp,
        email: backendData.email || localApt.email,
        residentes: backendData.residentes.length > 0 ? backendData.residentes : localApt.residentes,
        mascotas: backendData.mascotas.length > 0 ? backendData.mascotas : localApt.mascotas,
        caracterizacion: backendData.caracterizacion.adultosMayores !== undefined ? backendData.caracterizacion : localApt.caracterizacion,
        alarmaPrioridad: backendData.alarmaPrioridad || localApt.alarmaPrioridad,
      };
      // Actualizar también el cache local
      S.apartments[aptId] = { ...S.apartments[aptId], ...S.modalData };
      saveApartmentsLocal(S.apartments);
    } else {
      S.modalData = JSON.parse(JSON.stringify(S.apartments[aptId]));
    }
    render();
  }
  else if (action === "close-modal") { S.modalAptId = null; S.modalData = null; render(); }

  else if (action === "add-resident") {
    if (!S.newRes.nombre.trim() || !S.newRes.documento.trim()) return;
    S.modalData.residentes.push({ ...S.newRes, principal: S.modalData.residentes.length === 0 });
    S.newRes = { nombre: "", documento: "" };
    render();
  }
  else if (action === "remove-resident") { S.modalData.residentes.splice(Number(btn.dataset.idx), 1); render(); }
  else if (action === "set-principal") {
    S.modalData.residentes.forEach((r, i) => r.principal = i === Number(btn.dataset.idx));
    render();
  }
  else if (action === "add-pet") {
    if (!S.newPet.nombre.trim()) return;
    S.modalData.mascotas.push({ ...S.newPet, cantidad: S.newPet.cantidad || 1 });
    S.newPet = { nombre: "", tipo: "Canino", cantidad: 1 };
    render();
  }
  else if (action === "pet-qty-inc") {
    const idx = Number(btn.dataset.idx);
    S.modalData.mascotas[idx].cantidad = (S.modalData.mascotas[idx].cantidad || 1) + 1;
    render();
  }
  else if (action === "pet-qty-dec") {
    const idx = Number(btn.dataset.idx);
    if ((S.modalData.mascotas[idx].cantidad || 1) > 1) {
      S.modalData.mascotas[idx].cantidad = (S.modalData.mascotas[idx].cantidad || 1) - 1;
      render();
    }
  }
  else if (action === "new-pet-qty-inc") {
    S.newPet.cantidad = (S.newPet.cantidad || 1) + 1;
    render();
  }
  else if (action === "new-pet-qty-dec") {
    if ((S.newPet.cantidad || 1) > 1) {
      S.newPet.cantidad = (S.newPet.cantidad || 1) - 1;
      render();
    }
  }
  else if (action === "remove-pet") { S.modalData.mascotas.splice(Number(btn.dataset.idx), 1); render(); }
  else if (action === "toggle-car") {
    const key = btn.dataset.key;
    S.modalData.caracterizacion[key] = !S.modalData.caracterizacion[key];
    render();
  }
  else if (action === "toggle-alarm") { S.modalData.alarmaPrioridad = !S.modalData.alarmaPrioridad; render(); }

  else if (action === "save-apt") {
    // Guardar localmente primero
    S.apartments[S.modalData.id] = S.modalData;
    saveApartments(S.apartments);
    
    // Intentar guardar en backend
    const result = await saveApartmentToBackend(S.modalData);
    if (result.ok) {
      alert("✅ Datos guardados correctamente en el servidor");
    } else {
      alert("⚠️ Datos guardados solo localmente. Error: " + (result.error || "Backend no disponible"));
    }
    
    S.modalAptId = null; S.modalData = null;
    render();
  }

  else if (action === "add-brig") {
    S.brigada.push({ rol: S.newBrig.rol, cantidad: S.newBrig.cantidad || 1, id: Date.now() });
    saveBrigada(S.brigada);
    S.newBrig = { nombre: "", rol: "Primeros auxilios", cantidad: 1 };
    render();
  }
  else if (action === "brig-qty-inc") {
    const b = S.brigada.find(x => String(x.id) === btn.dataset.id);
    if (b) { b.cantidad = (b.cantidad || 1) + 1; saveBrigada(S.brigada); render(); }
  }
  else if (action === "brig-qty-dec") {
    const b = S.brigada.find(x => String(x.id) === btn.dataset.id);
    if (b && (b.cantidad || 1) > 1) { b.cantidad = (b.cantidad || 1) - 1; saveBrigada(S.brigada); render(); }
  }
  else if (action === "new-brig-qty-inc") {
    S.newBrig.cantidad = (S.newBrig.cantidad || 1) + 1;
    render();
  }
  else if (action === "new-brig-qty-dec") {
    if ((S.newBrig.cantidad || 1) > 1) {
      S.newBrig.cantidad = (S.newBrig.cantidad || 1) - 1;
      render();
    }
  }
  else if (action === "remove-brig") {
    S.brigada = S.brigada.filter((b) => String(b.id) !== btn.dataset.id);
    saveBrigada(S.brigada); render();
  }
  else if (action === "add-sim") {
    if (!S.newSim.fecha) return;
    S.simulacros.push({ ...S.newSim, id: Date.now() });
    saveSimulacros(S.simulacros);
    S.newSim = { fecha: "", tema: "Evacuación general" };
    render();
  }
  else if (action === "remove-sim") {
    S.simulacros = S.simulacros.filter((s) => String(s.id) !== btn.dataset.id);
    saveSimulacros(S.simulacros); render();
  }
});

/* ---------------------------- Persistencia de sesión ---------------------------- */

function saveSession() {
  const session = {
    view: S.view,
    adminToken: S.adminToken,
    residentToken: S.residentToken,
    residentAptId: S.residentAptId,
    backendModo: S.backendModo,
  };
  localStorage.setItem('pv2:session', JSON.stringify(session));
}

function restoreSession() {
  try {
    const saved = localStorage.getItem('pv2:session');
    if (saved) {
      const session = JSON.parse(saved);
      if (session.adminToken || session.residentToken) {
        S.view = session.view;
        S.adminToken = session.adminToken;
        S.residentToken = session.residentToken;
        S.residentAptId = session.residentAptId;
        S.backendModo = session.backendModo;
        return true;
      }
    }
  } catch (e) {}
  return false;
}

/* ---------------------------- Arranque ---------------------------- */

(async () => {
  const [apts, brig, sims] = await Promise.all([loadApartments(), loadBrigada(), loadSimulacros()]);
  S.apartments = apts; S.brigada = brig; S.simulacros = sims; S.loading = false;
  restoreSession();
  render();
})();
render();
</script>
</body>
</html>
